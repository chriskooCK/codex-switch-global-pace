name: CI

on:
  workflow_call:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read minimum Rust version
        id: package
        shell: bash
        run: |
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          root=$(jq -r '.workspace_default_members[0]' <<<"$metadata")
          msrv=$(jq -r --arg root "$root" '.packages[] | select(.id == $root) | .rust_version' <<<"$metadata")
          if [[ ! "$msrv" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Cargo.toml must declare a valid package rust-version" >&2
            exit 1
          fi
          echo "toolchain=$msrv" >> "$GITHUB_OUTPUT"
      - name: Install minimum Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head 2026-07-16
        with:
          toolchain: ${{ steps.package.outputs.toolchain }}
      - name: Check all targets with minimum Rust
        run: cargo check --locked --all-targets --features test-endpoints

  quality:
    name: Format and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head 2026-07-16
        with:
          components: rustfmt
      - name: Check shell script syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Check formatting
        run: cargo fmt --check
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit

  linux-release-targets:
    name: Build Linux release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head 2026-07-16
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Install Linux target tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cross --locked --git https://github.com/cross-rs/cross --rev 64b5bb4d3d34de062552b9a2093affe77b4ad16a
      - name: Build Linux AMD64 release target
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Build Linux ARM64 release target
        run: CROSS_CONFIG=Cross.toml cross build --release --locked --target aarch64-unknown-linux-musl

  test:
    name: Test (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            os: ubuntu-latest
          - host: macos
            os: macos-latest
          - host: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head 2026-07-16
        with:
          components: clippy
      - name: Check shell script syntax
        if: runner.os != 'Windows'
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Check PowerShell script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @('scripts/install.ps1', 'scripts/publish-dev.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}: {1}" -f $script, $_)
              }
              exit 1
            }
          }
      - name: Run tests
        run: cargo test --all --locked --features test-endpoints
      - name: Run Clippy
        run: cargo clippy --all-targets --locked --features test-endpoints -- -D warnings
      - name: Build debug binary
        run: cargo build --locked
