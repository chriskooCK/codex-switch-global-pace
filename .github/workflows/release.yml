name: Release

on:
  push:
    tags:
      - "v*"
      - "dev"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-publication
  # Never overlap two participating publications in this repository. Stable
  # recovery enumerates the repository-wide Release collection, so even different
  # tags must not move its pagination boundaries concurrently. A stable candidate
  # uses a deterministic tag, allowing the next serialized run to identify an
  # interrupted draft before creating a new one. GitHub's ref and Release deletion
  # APIs have no conditional version precondition, so repository administrators
  # must not mutate these temporary objects while a run is active.
  # The stable job also acquires the historical
  # refs/tags/codex-switch-publish-dev-lock remote lease before it reads or changes
  # refs or Releases. That shared lease serializes Actions with publish-dev.ps1;
  # its old name is retained so an existing publisher lock cannot be bypassed.
  # Release deletion APIs have no conditional version precondition; only the
  # shared lock and immediate identity checks serialize cooperating writers.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      is_dev: ${{ steps.parse.outputs.is_dev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse tag
        id: parse
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          BASE=$(cat VERSION)
          MANIFEST_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [[ ! "$BASE" =~ ^[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain a SemVer-compatible numeric base" >&2
            exit 1
          fi
          if [[ "$MANIFEST_VERSION" != "$BASE" ]]; then
            echo "Cargo.toml version must match VERSION" >&2
            exit 1
          fi
          if [[ "$RAW_TAG" == "dev" ]]; then
            echo "version=${BASE}-dev" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          else
            TAG="${RAW_TAG#v}"
            PRERELEASE_IDENTIFIER='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
            BASE_PATTERN="${BASE//./\\.}"
            TAG_PATTERN="^${BASE_PATTERN}(-${PRERELEASE_IDENTIFIER}(\.${PRERELEASE_IDENTIFIER})*)?$"
            if [[ ! "$TAG" =~ $TAG_PATTERN ]]; then
              echo "release tag must match VERSION with an optional SemVer prerelease suffix" >&2
              exit 1
            fi
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            if [[ "$TAG" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: [quality, meta]
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
      CS_RELEASE_SOURCE_COMMIT: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: codex-switch-global-pace-linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: codex-switch-global-pace-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: codex-switch-global-pace-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: codex-switch-global-pace-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: codex-switch-global-pace-windows-amd64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: codex-switch-global-pace-windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch head 2026-07-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Install cross (Linux ARM64 musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev 64b5bb4d3d34de062552b9a2093affe77b4ad16a
      - name: Inject release version
        shell: bash
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"${RELEASE_VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          awk -v version="${RELEASE_VERSION}" '
            BEGIN { package = ""; replaced = 0 }
            { sub(/\r$/, "") }
            /^\[\[package\]\]$/ { package = "" }
            /^name = "/ { package = $0 }
            package == "name = \"codex-switch-global-pace\"" && /^version = "/ {
              print "version = \"" version "\""
              package = ""
              replaced += 1
              next
            }
            { print }
            END { if (replaced != 1) exit 1 }
          ' Cargo.lock > Cargo.lock.release
          mv Cargo.lock.release Cargo.lock
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            CROSS_CONFIG=Cross.toml cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/codex-switch-global-pace"
          chmod +x "$BIN"
          tar czf "${{ matrix.name }}.tar.gz" -C "target/${{ matrix.target }}/release" codex-switch-global-pace
          shasum -a 256 "${{ matrix.name }}.tar.gz" > "${{ matrix.name }}.tar.gz.sha256"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a "${{ matrix.name }}.zip" "./target/${{ matrix.target }}/release/codex-switch-global-pace.exe"
          sha256sum "${{ matrix.name }}.zip" > "${{ matrix.name }}.zip.sha256"
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.zip.sha256
          if-no-files-found: ignore

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify release checksums
        shell: bash
        run: |
          archives=(
            codex-switch-global-pace-linux-amd64.tar.gz
            codex-switch-global-pace-linux-arm64.tar.gz
            codex-switch-global-pace-darwin-amd64.tar.gz
            codex-switch-global-pace-darwin-arm64.tar.gz
            codex-switch-global-pace-windows-amd64.zip
            codex-switch-global-pace-windows-arm64.zip
          )
          for name in "${archives[@]}"; do
            archive="artifacts/${name}"
            checksum="${archive}.sha256"
            if [[ ! -s "$archive" || ! -s "$checksum" ]]; then
              echo "Missing or empty release archive/checksum: $archive / $checksum" >&2
              exit 1
            fi
            (cd artifacts && sha256sum --check "$(basename "$checksum")")
          done
      - name: Add installers and install notes
        shell: bash
        run: |
          sed "s/^PACKAGED_RELEASE_VERSION=\"\"/PACKAGED_RELEASE_VERSION=\"${RELEASE_VERSION}\"/" \
            scripts/install.sh > artifacts/install.sh
          sed "s/^\$PackagedReleaseVersion = \"\"/\$PackagedReleaseVersion = \"${RELEASE_VERSION}\"/" \
            scripts/install.ps1 > artifacts/install.ps1
          grep -Fqx "PACKAGED_RELEASE_VERSION=\"${RELEASE_VERSION}\"" artifacts/install.sh
          grep -Fqx "\$PackagedReleaseVersion = \"${RELEASE_VERSION}\"" artifacts/install.ps1
          release_tag="${GITHUB_REF#refs/tags/}"
          unix_install_args=""
          if [[ "${{ needs.meta.outputs.is_dev }}" == true ]]; then
            unix_install_args="--dev"
          fi
          cat > artifacts/INSTALL.md << 'EOF'
          ## Verified install

          The reviewed trust anchor is the [source-controlled install guide](https://github.com/chriskooCK/codex-switch-global-pace/blob/__SOURCE_DIGEST__/docs/wiki/Getting-Started.md#install).
          This release-exact copy is also covered by the provenance bundle, but
          an unverified copy of these instructions cannot authenticate itself.

          These commands require a current [GitHub CLI](https://cli.github.com/).
          They verify the installer against this repository, release workflow,
          and exact tag after peeling annotated tags. Verification failure stops the
          bootstrap; there is no unverified fallback.

          macOS / Linux:

          ```bash
          set -eu
          repo=chriskooCK/codex-switch-global-pace
          bootstrap_error() {
            printf '%s\n' "$1" >&2
            exit 1
          }
          resolve_release_tag_commit() {
            local tag_to_resolve="$1" endpoint tuple kind sha extra depth=0
            endpoint="repos/$repo/git/ref/tags/$tag_to_resolve"
            while [ "$depth" -le 5 ]; do
              tuple="$(gh api --hostname github.com "$endpoint" \
                --jq '[.object.type, .object.sha] | @tsv')" \
                || bootstrap_error "Could not resolve release tag $tag_to_resolve."
              case "$tuple" in
                *$'\n'*) bootstrap_error "Release tag $tag_to_resolve returned more than one object record." ;;
              esac
              IFS=$'\t' read -r kind sha extra <<< "$tuple"
              [ -n "$kind" ] && [ -n "$sha" ] && [ -z "${extra:-}" ] \
                || bootstrap_error "Release tag $tag_to_resolve returned an invalid object record."
              [ "${#sha}" -eq 40 ] && [[ "$sha" != *[!0-9A-Fa-f]* ]] \
                || bootstrap_error "Release tag $tag_to_resolve returned an invalid Git object digest."
              if [ "$kind" = commit ]; then
                printf '%s\n' "$sha" | tr '[:upper:]' '[:lower:]'
                return 0
              fi
              [ "$kind" = tag ] \
                || bootstrap_error "Release tag $tag_to_resolve resolved to unsupported Git object type $kind."
              [ "$depth" -lt 5 ] \
                || bootstrap_error "Release tag $tag_to_resolve contains more than five nested annotated tags."
              endpoint="repos/$repo/git/tags/$sha"
              depth=$((depth + 1))
            done
          }
          tag=__RELEASE_TAG__
          source_digest=__SOURCE_DIGEST__
          [ "${#source_digest}" -eq 40 ] || {
            printf 'Invalid embedded Release source digest.\n' >&2
            exit 1
          }
          case "$source_digest" in
            *[!0-9a-f]*)
              printf 'Invalid embedded Release source digest.\n' >&2
              exit 1
              ;;
          esac
          current_digest="$(resolve_release_tag_commit "$tag")"
          [ "$current_digest" = "$source_digest" ] || {
            printf 'Release tag moved; refusing installer execution.\n' >&2
            exit 1
          }
          work="$(mktemp -d)"
          cleanup() {
            status=$?
            rm -f -- \
              "$work/install.sh" \
              "$work/codex-switch-global-pace-build-provenance.json" || status=1
            rmdir -- "$work" || status=1
            exit "$status"
          }
          trap cleanup EXIT
          gh release download "$tag" --repo "$repo" --dir "$work" \
            --pattern install.sh \
            --pattern codex-switch-global-pace-build-provenance.json
          gh attestation verify "$work/install.sh" \
            --bundle "$work/codex-switch-global-pace-build-provenance.json" \
            --repo "$repo" \
            --signer-workflow "$repo/.github/workflows/release.yml" \
            --source-ref "refs/tags/$tag" \
            --source-digest "$source_digest" \
            --deny-self-hosted-runners
          confirmed_digest="$(resolve_release_tag_commit "$tag")"
          [ "$confirmed_digest" = "$source_digest" ] || {
            printf 'Release tag moved during verification; refusing installer execution.\n' >&2
            exit 1
          }
          bash "$work/install.sh" __UNIX_INSTALL_ARGS__
          ```

          Windows PowerShell:

          ```powershell
          $ErrorActionPreference = "Stop"
          $Repo = "chriskooCK/codex-switch-global-pace"
          function Resolve-ReleaseTagCommit {
              param([Parameter(Mandatory = $true)][string]$TagToResolve)

              $Endpoint = "repos/$Repo/git/ref/tags/$TagToResolve"
              foreach ($Depth in 0..5) {
                  $Response = @(gh api --hostname github.com $Endpoint `
                      --jq '[.object.type, .object.sha] | @tsv' 2>&1)
                  $ExitCode = $LASTEXITCODE
                  if ($ExitCode -ne 0) {
                      throw "Could not resolve release tag '$TagToResolve': $([string]::Join(' ', $Response))"
                  }
                  if ($Response.Count -ne 1) {
                      throw "Release tag '$TagToResolve' returned $($Response.Count) object records; expected exactly one."
                  }
                  $Fields = ([string]$Response[0]).Split([char]"`t")
                  if ($Fields.Count -ne 2 -or
                      [string]::IsNullOrWhiteSpace($Fields[0]) -or
                      $Fields[1] -cnotmatch '\A[0-9A-Fa-f]{40}\z') {
                      throw "Release tag '$TagToResolve' returned an invalid Git object record."
                  }
                  $Kind = $Fields[0]
                  $Sha = $Fields[1].ToLowerInvariant()
                  if ($Kind -ceq 'commit') { return $Sha }
                  if ($Kind -cne 'tag') {
                      throw "Release tag '$TagToResolve' resolved to unsupported Git object type '$Kind'."
                  }
                  if ($Depth -eq 5) {
                      throw "Release tag '$TagToResolve' contains more than five nested annotated tags."
                  }
                  $Endpoint = "repos/$Repo/git/tags/$Sha"
              }
              throw "Release tag '$TagToResolve' could not be resolved to a commit."
          }
          $Tag = "__RELEASE_TAG__"
          $SourceDigest = "__SOURCE_DIGEST__"
          if ($SourceDigest -cnotmatch '\A[0-9a-f]{40}\z') {
              throw "Invalid embedded Release source digest."
          }
          $CurrentDigest = Resolve-ReleaseTagCommit -TagToResolve $Tag
          if ($CurrentDigest -cne $SourceDigest) {
              throw "Release tag moved or returned an invalid digest; refusing installer execution."
          }
          $Work = Join-Path ([IO.Path]::GetTempPath()) "codex-switch-install-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $Work | Out-Null
          try {
              gh release download $Tag --repo $Repo --dir $Work `
                  --pattern install.ps1 `
                  --pattern codex-switch-global-pace-build-provenance.json
              if ($LASTEXITCODE -ne 0) { throw "Release download failed." }
              gh attestation verify (Join-Path $Work "install.ps1") `
                  --bundle (Join-Path $Work "codex-switch-global-pace-build-provenance.json") `
                  --repo $Repo `
                  --signer-workflow "$Repo/.github/workflows/release.yml" `
                  --source-ref "refs/tags/$Tag" `
                  --source-digest $SourceDigest `
                  --deny-self-hosted-runners
              if ($LASTEXITCODE -ne 0) { throw "Installer provenance verification failed." }
              $ConfirmedDigest = Resolve-ReleaseTagCommit -TagToResolve $Tag
              if ($ConfirmedDigest -cne $SourceDigest) {
                  throw "Release tag moved during verification; refusing installer execution."
              }
              & (Join-Path $Work "install.ps1")
          } finally {
              Remove-Item -LiteralPath (Join-Path $Work "install.ps1") -Force -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath (Join-Path $Work "codex-switch-global-pace-build-provenance.json") -Force -ErrorAction SilentlyContinue
              [IO.Directory]::Delete($Work, $false)
          }
          ```

          The packaged development installer selects the dev channel automatically.
          Both installers reuse `CODEX_SWITCH_HOME` (default `~/.codex-switch`).
          EOF
          sed -i \
            -e "s/__RELEASE_TAG__/${release_tag}/g" \
            -e "s/__SOURCE_DIGEST__/${GITHUB_SHA}/g" \
            -e "s/__UNIX_INSTALL_ARGS__/${unix_install_args}/g" \
            artifacts/INSTALL.md
          ! grep -Eq '__RELEASE_TAG__|__SOURCE_DIGEST__|__UNIX_INSTALL_ARGS__' artifacts/INSTALL.md
      - name: Attest release archives and installers
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/INSTALL.md
            artifacts/install.sh
            artifacts/install.ps1
      - name: Add provenance bundle to release assets
        shell: bash
        run: cp "${{ steps.attest.outputs.bundle-path }}" artifacts/codex-switch-global-pace-build-provenance.json
      - name: Generate release body
        shell: bash
        run: |
          if [[ "${{ needs.meta.outputs.is_dev }}" == true ]]; then
            cat > release_body.md << EOF
          Development build from \`${GITHUB_REF}\` at ${GITHUB_SHA}.

          Use \`codex-switch-global-pace self-update --dev\` to install, or \`codex-switch-global-pace self-update --stable\` to return to stable.

          Start with the [source-controlled verified install guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/wiki/Getting-Started.md#install). It verifies the installer before execution with no fallback.

          The attached \`INSTALL.md\` is release-exact and attested in the same provenance bundle. The packaged Windows installer selects dev automatically.

          Version: \`${RELEASE_VERSION}\`
          EOF
          else
            cat > release_body.md << EOF
          Profiles and configuration under \`~/.codex-switch\` are preserved.

          Start with the [source-controlled verified install guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/wiki/Getting-Started.md#install). It verifies the installer before execution with no fallback.

          The attached \`INSTALL.md\` is release-exact and attested in the same provenance bundle.
          EOF
          fi
      - name: Verify packaged release version
        shell: bash
        run: |
          candidate_dir="$RUNNER_TEMP/release-version-check"
          mkdir -p "$candidate_dir"
          tar xzf artifacts/codex-switch-global-pace-linux-amd64.tar.gz -C "$candidate_dir"
          chmod +x "$candidate_dir/codex-switch-global-pace"
          actual_output=$($candidate_dir/codex-switch-global-pace --version)
          actual=${actual_output%%$'\n'*}
          actual=${actual%$'\r'}
          expected="codex-switch-global-pace ${RELEASE_VERSION}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Packaged binary version mismatch: expected '$expected', found '$actual'" >&2
            exit 1
          fi
      - name: Verify exact local release asset set
        shell: bash
        run: |
          expected_names=(
            INSTALL.md
            codex-switch-global-pace-build-provenance.json
            codex-switch-global-pace-darwin-amd64.tar.gz
            codex-switch-global-pace-darwin-amd64.tar.gz.sha256
            codex-switch-global-pace-darwin-arm64.tar.gz
            codex-switch-global-pace-darwin-arm64.tar.gz.sha256
            codex-switch-global-pace-linux-amd64.tar.gz
            codex-switch-global-pace-linux-amd64.tar.gz.sha256
            codex-switch-global-pace-linux-arm64.tar.gz
            codex-switch-global-pace-linux-arm64.tar.gz.sha256
            codex-switch-global-pace-windows-amd64.zip
            codex-switch-global-pace-windows-amd64.zip.sha256
            codex-switch-global-pace-windows-arm64.zip
            codex-switch-global-pace-windows-arm64.zip.sha256
            install.ps1
            install.sh
          )
          mapfile -t actual_names < <(
            find artifacts -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
          )
          if (( ${#expected_names[@]} != 16 || ${#actual_names[@]} != 16 )) || \
             ! diff -u \
               <(printf '%s\n' "${expected_names[@]}") \
               <(printf '%s\n' "${actual_names[@]}"); then
            echo "Release bundle must contain exactly the 16 expected assets." >&2
            exit 1
          fi
          for name in "${expected_names[@]}"; do
            if [[ ! -s "artifacts/$name" ]]; then
              echo "Release asset artifacts/$name is missing or empty." >&2
              exit 1
            fi
          done
          if [[ ! -s release_body.md ]]; then
            echo "release_body.md is missing or empty." >&2
            exit 1
          fi
          jq empty artifacts/codex-switch-global-pace-build-provenance.json
      - name: Prepare release verifiers
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/verify-release-tag.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          object=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")
          kind=$(jq -r '.object.type' <<<"$object")
          sha=$(jq -r '.object.sha' <<<"$object")
          for depth in 0 1 2 3 4 5; do
            if [[ "$kind" == commit ]]; then
              if [[ "${sha,,}" == "${GITHUB_SHA,,}" ]]; then
                exit 0
              fi
              echo "release tag ${tag} moved: expected ${GITHUB_SHA}, found ${sha}" >&2
              exit 2
            fi
            if [[ "$kind" != tag ]]; then
              echo "release tag ${tag} resolved to unsupported object ${kind}:${sha}" >&2
              exit 2
            fi
            if (( depth == 5 )); then
              break
            fi
            object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}")
            kind=$(jq -r '.object.type' <<<"$object")
            sha=$(jq -r '.object.sha' <<<"$object")
          done
          echo "release tag ${tag} has more than five nested annotated tags" >&2
          exit 2
          EOF
          chmod +x "$RUNNER_TEMP/verify-release-tag.sh"
          cat > "$RUNNER_TEMP/verify-release-assets.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          release_id=$1
          expected_dir=$2
          download_dir=$3
          verification_mode=${4:-exact}
          mkdir -p "$download_dir"
          assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100")
          mapfile -t expected_names < <(find "$expected_dir" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          mapfile -t remote_names < <(jq -r '.[].name' <<<"$assets" | LC_ALL=C sort)
          if [[ "$verification_mode" == subset ]]; then
            for name in "${remote_names[@]}"; do
              owned=false
              for expected_name in "${expected_names[@]}"; do
                if [[ "$name" == "$expected_name" ]]; then
                  owned=true
                  break
                fi
              done
              matches=$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' <<<"$assets")
              if [[ "$owned" != true || "$matches" != 1 ]]; then
                echo "Release ${release_id} has an unowned or duplicate candidate asset ${name}." >&2
                exit 1
              fi
            done
            names_to_verify=("${remote_names[@]}")
          else
            if ! diff -u <(printf '%s\n' "${expected_names[@]}") <(printf '%s\n' "${remote_names[@]}"); then
              echo "Release ${release_id} asset names do not exactly match the candidate." >&2
              exit 1
            fi
            names_to_verify=("${expected_names[@]}")
          fi
          for name in "${names_to_verify[@]}"; do
            matches=$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' <<<"$assets")
            if [[ "$matches" != 1 ]]; then
              echo "Release ${release_id} has ${matches} assets named ${name}." >&2
              exit 1
            fi
            asset=$(jq -c --arg name "$name" '.[] | select(.name == $name)' <<<"$assets")
            asset_id=$(jq -r '.id' <<<"$asset")
            state=$(jq -r '.state' <<<"$asset")
            size=$(jq -r '.size' <<<"$asset")
            if [[ ! "$asset_id" =~ ^[1-9][0-9]*$ || "$state" != uploaded || ! "$size" =~ ^[1-9][0-9]*$ ]]; then
              echo "Release ${release_id} asset ${name} is not a complete non-empty upload." >&2
              exit 1
            fi
            downloaded="$download_dir/$name"
            gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$downloaded"
            if [[ "$verification_mode" == attest ]]; then
              case "$name" in
                *.tar.gz|*.zip|*.sha256)
                  continue
                  ;;
                codex-switch-global-pace-build-provenance.json)
                  jq empty "$downloaded"
                  continue
                  ;;
              esac
            fi
            if ! cmp -s "$expected_dir/$name" "$downloaded"; then
              echo "Release ${release_id} asset ${name} differs from the verified candidate." >&2
              exit 1
            fi
          done
          if [[ "$verification_mode" == attest ]]; then
            provenance_bundle="$download_dir/codex-switch-global-pace-build-provenance.json"
            for subject in \
              "$download_dir"/*.tar.gz \
              "$download_dir"/*.zip \
              "$download_dir/INSTALL.md" \
              "$download_dir/install.sh" \
              "$download_dir/install.ps1"
            do
              verification=$(gh attestation verify "$subject" \
                --repo "$GITHUB_REPOSITORY" \
                --bundle "$provenance_bundle" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-digest "$GITHUB_SHA" \
                --source-ref "$GITHUB_REF" \
                --deny-self-hosted-runners \
                --format json)
              if ! jq -e \
                --arg sha "$GITHUB_SHA" \
                --arg ref "$GITHUB_REF" \
                --arg repository "https://github.com/${GITHUB_REPOSITORY}" \
                'any(.[];
                  .verificationResult.statement.predicate.buildDefinition.externalParameters.workflow.ref == $ref and
                  .verificationResult.statement.predicate.buildDefinition.externalParameters.workflow.repository == $repository and
                  .verificationResult.statement.predicate.buildDefinition.externalParameters.workflow.path == ".github/workflows/release.yml" and
                  any(.verificationResult.statement.predicate.buildDefinition.resolvedDependencies[]?;
                    .digest.gitCommit == $sha))' <<<"$verification" > /dev/null; then
                echo "Existing release asset $(basename "$subject") is not attested to ${GITHUB_SHA}." >&2
                exit 1
              fi
            done
            for archive in "$download_dir"/*.tar.gz "$download_dir"/*.zip; do
              checksum="${archive}.sha256"
              if [[ "$(wc -l < "$checksum")" != 1 ]]; then
                echo "Existing checksum $(basename "$checksum") must contain exactly one line." >&2
                exit 1
              fi
              IFS=$' \t' read -r recorded_digest recorded_name trailing < "$checksum"
              recorded_name=${recorded_name#\*}
              archive_name=$(basename "$archive")
              if [[ ! "$recorded_digest" =~ ^[0-9a-fA-F]{64}$ || \
                    "$recorded_name" != "$archive_name" || -n "$trailing" ]]; then
                echo "Existing checksum $(basename "$checksum") has an invalid record." >&2
                exit 1
              fi
              actual_digest=$(sha256sum -- "$archive")
              actual_digest=${actual_digest%% *}
              if [[ "${actual_digest,,}" != "${recorded_digest,,}" ]]; then
                echo "Existing checksum $(basename "$checksum") does not match ${archive_name}." >&2
                exit 1
              fi
            done
            version_dir="$download_dir/version-check"
            mkdir -p "$version_dir"
            tar xzf "$download_dir/codex-switch-global-pace-linux-amd64.tar.gz" -C "$version_dir"
            chmod +x "$version_dir/codex-switch-global-pace"
            actual_output=$($version_dir/codex-switch-global-pace --version)
            actual=${actual_output%%$'\n'*}
            actual=${actual%$'\r'}
            expected="codex-switch-global-pace ${RELEASE_VERSION}"
            if [[ "$actual" != "$expected" ]]; then
              echo "Existing release binary version mismatch: expected '$expected', found '$actual'." >&2
              exit 1
            fi
          fi
          EOF
          chmod +x "$RUNNER_TEMP/verify-release-assets.sh"
      - name: Prepare exact dev artifact bundle
        if: needs.meta.outputs.is_dev == 'true'
        shell: bash
        run: |
          mkdir dev-bundle
          cp -- artifacts/* release_body.md dev-bundle/
          mapfile -t expected_names < <(
            {
              find artifacts -maxdepth 1 -type f -printf '%f\n'
              printf '%s\n' release_body.md
            } | LC_ALL=C sort
          )
          mapfile -t bundled_names < <(
            find dev-bundle -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort
          )
          if (( ${#expected_names[@]} != 17 || ${#bundled_names[@]} != 17 )) || \
             ! diff -u \
               <(printf '%s\n' "${expected_names[@]}") \
               <(printf '%s\n' "${bundled_names[@]}"); then
            echo "Development artifact must contain exactly the 16 release assets and release_body.md." >&2
            exit 1
          fi
          for name in "${bundled_names[@]}"; do
            if [[ ! -f "dev-bundle/$name" || ! -s "dev-bundle/$name" ]]; then
              echo "Development artifact file dev-bundle/$name is missing or empty." >&2
              exit 1
            fi
          done
      - name: Confirm exact dev tag before artifact upload
        if: needs.meta.outputs.is_dev == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "$RUNNER_TEMP/verify-release-tag.sh"
      - name: Preserve verified dev release bundle
        if: needs.meta.outputs.is_dev == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dev-release-${{ github.sha }}
          path: dev-bundle/
          retention-days: 7
          if-no-files-found: error
      - name: Acquire shared remote publication lock
        id: publication_lock
        if: needs.meta.outputs.is_dev != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          lock_tag="codex-switch-publish-dev-lock"
          lock_ref="refs/tags/${lock_tag}"
          source_sha="${GITHUB_SHA,,}"

          existing_error="$RUNNER_TEMP/shared-publication-lock-existing-error"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${lock_tag}" \
            > /dev/null 2>"$existing_error"; then
            echo "Shared publication lock ${lock_ref} already exists; it was not acquired or removed." >&2
            exit 1
          elif ! grep -Eq 'HTTP 404|Not Found' "$existing_error"; then
            cat "$existing_error" >&2
            echo "Shared publication lock absence could not be established; no ownership was claimed." >&2
            exit 1
          fi

          transaction=$(od -An -N16 -tx1 /dev/urandom | tr -d '[:space:]')
          if [[ ! "$transaction" =~ ^[0-9a-f]{32}$ ]]; then
            echo "Could not create an exact publication-lock transaction identity." >&2
            exit 1
          fi
          # Keep the historical v1 identity format used by publish-dev.ps1. The
          # tag is now a shared publication lock even though its durable protocol
          # name predates stable Actions publication.
          message="codex-switch-global-pace publish-dev lock v1|repo=${GITHUB_REPOSITORY}|source=${source_sha}|transaction=${transaction}"
          jq -n \
            --arg tag "$lock_tag" \
            --arg message "$message" \
            --arg object "$source_sha" \
            '{tag:$tag,message:$message,object:$object,type:"commit"}' \
            > "$RUNNER_TEMP/shared-publication-lock-tag.json"

          tag_error="$RUNNER_TEMP/shared-publication-lock-tag-error"
          if ! tag_object=$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/git/tags" \
            --input "$RUNNER_TEMP/shared-publication-lock-tag.json" \
            2>"$tag_error"); then
            cat "$tag_error" >&2
            echo "Shared publication lock object creation failed or its response was lost; no ownership was claimed and nothing will be removed." >&2
            exit 1
          fi
          if ! jq -e 'type == "object"' <<<"$tag_object" > /dev/null; then
            echo "Shared publication lock object creation returned invalid JSON; no ownership was claimed." >&2
            exit 1
          fi
          tag_object_sha=$(jq -r '.sha' <<<"$tag_object")
          if [[ ! "$tag_object_sha" =~ ^[0-9a-fA-F]{40}$ || \
                "$(jq -r '.tag' <<<"$tag_object")" != "$lock_tag" || \
                "$(jq -r '.message' <<<"$tag_object")" != "$message" || \
                "$(jq -r '.object.type' <<<"$tag_object")" != commit || \
                "$(jq -r '.object.sha' <<<"$tag_object" | tr '[:upper:]' '[:lower:]')" != "$source_sha" ]]; then
            echo "Shared publication lock object creation returned an unexpected identity; no ownership was claimed." >&2
            exit 1
          fi
          tag_object_sha="${tag_object_sha,,}"

          # Persist the complete candidate identity before creating the fixed
          # ref. If GitHub applies the POST but its response is lost, the
          # always-run cleanup can still prove the exact candidate identity and perform one
          # leased deletion. The trigger is written last so a partial output
          # write never enables cleanup with an incomplete identity tuple.
          {
            echo "tag=${lock_tag}"
            echo "tag_object_sha=${tag_object_sha}"
            echo "source_sha=${source_sha}"
            echo "transaction=${transaction}"
            echo "message=${message}"
            echo "cleanup_candidate=true"
          } >> "$GITHUB_OUTPUT"

          jq -n \
            --arg ref "$lock_ref" \
            --arg sha "$tag_object_sha" \
            '{ref:$ref,sha:$sha}' \
            > "$RUNNER_TEMP/shared-publication-lock-ref.json"
          ref_error="$RUNNER_TEMP/shared-publication-lock-ref-error"
          if ! created_ref=$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            --input "$RUNNER_TEMP/shared-publication-lock-ref.json" \
            2>"$ref_error"); then
            cat "$ref_error" >&2
            echo "Shared publication lock acquisition failed or its response was lost; exact candidate cleanup will inspect the fixed ref before removing anything." >&2
            exit 1
          fi
          if ! jq -e 'type == "object"' <<<"$created_ref" > /dev/null; then
            echo "Shared publication lock acquisition returned invalid JSON; exact candidate cleanup will inspect the fixed ref before removing anything." >&2
            exit 1
          fi
          if [[ "$(jq -r '.ref' <<<"$created_ref")" != "$lock_ref" || \
                "$(jq -r '.object.type' <<<"$created_ref")" != tag || \
                "$(jq -r '.object.sha' <<<"$created_ref" | tr '[:upper:]' '[:lower:]')" != "$tag_object_sha" ]]; then
            echo "Shared publication lock acquisition returned an unexpected identity; exact candidate cleanup will preserve any non-matching ref." >&2
            exit 1
          fi

          verify_ref_error="$RUNNER_TEMP/shared-publication-lock-verify-ref-error"
          if ! verified_ref=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${lock_tag}" \
            2>"$verify_ref_error"); then
            cat "$verify_ref_error" >&2
            echo "Shared publication lock ownership could not be confirmed; exact candidate cleanup will re-inspect the fixed ref." >&2
            exit 1
          fi
          if ! jq -e 'type == "object"' <<<"$verified_ref" > /dev/null; then
            echo "Shared publication lock ref verification returned invalid JSON; exact candidate cleanup will re-inspect the fixed ref." >&2
            exit 1
          fi
          if [[ "$(jq -r '.ref' <<<"$verified_ref")" != "$lock_ref" || \
                "$(jq -r '.object.type' <<<"$verified_ref")" != tag || \
                "$(jq -r '.object.sha' <<<"$verified_ref" | tr '[:upper:]' '[:lower:]')" != "$tag_object_sha" ]]; then
            echo "Shared publication lock ref changed before ownership confirmation; exact candidate cleanup will preserve a non-matching identity." >&2
            exit 1
          fi
          verify_tag_error="$RUNNER_TEMP/shared-publication-lock-verify-tag-error"
          if ! verified_tag=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
            2>"$verify_tag_error"); then
            cat "$verify_tag_error" >&2
            echo "Shared publication lock object could not be confirmed; exact candidate cleanup will revalidate it before removing the ref." >&2
            exit 1
          fi
          if ! jq -e 'type == "object"' <<<"$verified_tag" > /dev/null; then
            echo "Shared publication lock object verification returned invalid JSON; exact candidate cleanup will revalidate it before removing the ref." >&2
            exit 1
          fi
          if [[ "$(jq -r '.sha' <<<"$verified_tag" | tr '[:upper:]' '[:lower:]')" != "$tag_object_sha" || \
                "$(jq -r '.tag' <<<"$verified_tag")" != "$lock_tag" || \
                "$(jq -r '.message' <<<"$verified_tag")" != "$message" || \
                "$(jq -r '.object.type' <<<"$verified_tag")" != commit || \
                "$(jq -r '.object.sha' <<<"$verified_tag" | tr '[:upper:]' '[:lower:]')" != "$source_sha" ]]; then
            echo "Shared publication lock object changed before ownership confirmation; exact candidate cleanup will preserve the ref." >&2
            exit 1
          fi
      - name: Confirm release tag still targets this source before publish
        if: needs.meta.outputs.is_dev != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "$RUNNER_TEMP/verify-release-tag.sh"
      - name: Inspect an existing exact-tag release
        id: existing
        if: needs.meta.outputs.is_dev != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          error_file="$RUNNER_TEMP/existing-release-error"
          if release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>"$error_file"); then
            :
          elif grep -Eq 'HTTP 404|Not Found' "$error_file"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            cat "$error_file" >&2
            exit 1
          fi
          release_id=$(jq -r '.id' <<<"$release")
          target=$(jq -r '.target_commitish' <<<"$release")
          expected_body_prefix=$(cat release_body.md)
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ || \
                "$(jq -r '.tag_name' <<<"$release")" != "$tag" || \
                "$(jq -r '.draft' <<<"$release")" != false || \
                "$(jq -r '.immutable' <<<"$release")" != false ]]; then
            echo "Existing release for ${tag} is not a published exact-tag release." >&2
            exit 1
          fi
          expected_prerelease="${{ needs.meta.outputs.prerelease }}"
          if [[ "${target,,}" != "${GITHUB_SHA,,}" || \
                "$(jq -r '.prerelease' <<<"$release")" != "$expected_prerelease" || \
                "$(jq -r '.name' <<<"$release")" != "$tag" || \
                "$(jq -r '.body' <<<"$release")" != "$expected_body_prefix"* ]]; then
            echo "Existing stable release ${release_id} metadata differs from this exact source." >&2
            exit 1
          fi
          "$RUNNER_TEMP/verify-release-assets.sh" \
            "$release_id" artifacts "$RUNNER_TEMP/existing-release-assets" attest

          # Publication can finish before a runner disappears while removing
          # the temporary candidate ref. Only the fully verified final release
          # authorizes recovery of that deterministic ref.
          candidate_tag="release-candidate-${tag}"
          candidate_ref_error="$RUNNER_TEMP/existing-release-candidate-ref-error"
          if candidate_ref=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${candidate_tag}" \
            2>"$candidate_ref_error"); then
            if [[ "$(jq -r '.object.type' <<<"$candidate_ref")" != commit || \
                  "$(jq -r '.object.sha' <<<"$candidate_ref" | tr '[:upper:]' '[:lower:]')" != "${GITHUB_SHA,,}" ]]; then
              echo "Recovered candidate ref ${candidate_tag} changed identity; it was preserved." >&2
              exit 1
            fi
            if ! gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${candidate_tag}"; then
              echo "Recovered candidate ref deletion returned an error; checking its final state." >&2
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${candidate_tag}" \
              > /dev/null 2>"$RUNNER_TEMP/existing-release-candidate-ref-after-delete-error"; then
              echo "Recovered candidate ref ${candidate_tag} remains." >&2
              exit 1
            elif ! grep -Eq 'HTTP 404|Not Found' \
              "$RUNNER_TEMP/existing-release-candidate-ref-after-delete-error"; then
              cat "$RUNNER_TEMP/existing-release-candidate-ref-after-delete-error" >&2
              echo "Could not confirm recovered candidate ref removal." >&2
              exit 1
            fi
          elif ! grep -Eq 'HTTP 404|Not Found' "$candidate_ref_error"; then
            cat "$candidate_ref_error" >&2
            echo "Could not inspect the recovered candidate ref; publication remains unconfirmed." >&2
            exit 1
          fi
          echo "skip=true" >> "$GITHUB_OUTPUT"
      - name: Create isolated candidate draft
        id: candidate
        if: needs.meta.outputs.is_dev != 'true' && steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          final_tag="${GITHUB_REF#refs/tags/}"
          candidate_tag="release-candidate-${final_tag}"
          release_name="$final_tag"
          prerelease="${{ needs.meta.outputs.prerelease }}"

          # A hosted runner can disappear without executing an `always()`
          # cleanup step. The candidate tag is deterministic for this exact
          # serialized release, so a rerun can recover only a draft whose full
          # identity still belongs to the same source and release. The by-ID and
          # by-name checks immediately before deletion preserve every mismatch
          # they observe; they are the strongest available REST checks, not an
          # atomic compare-and-delete against an external administrator.
          candidate_releases="$RUNNER_TEMP/candidate-releases.json"
          if ! gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "$candidate_releases"; then
            echo "Could not enumerate authenticated repository releases to recover ${candidate_tag}." >&2
            exit 1
          fi
          if ! jq -e '
            (type == "array")
            and (length > 0)
            and all(.[];
              (type == "array")
              and all(.[];
                (type == "object")
                and (.id | (type == "number") and (. > 0) and (floor == .))
                and (.tag_name | type == "string")
                and (.tag_name | length > 0)
              )
            )
          ' "$candidate_releases" > /dev/null; then
            echo "GitHub returned an invalid paginated release list." >&2
            exit 1
          fi
          candidate_release_count=$(jq \
            --arg tag "$candidate_tag" \
            '[.[][] | select(.tag_name == $tag)] | length' \
            "$candidate_releases")
          if (( candidate_release_count > 1 )); then
            echo "Found ${candidate_release_count} releases for candidate tag ${candidate_tag}; refusing ambiguous recovery." >&2
            exit 1
          fi
          if (( candidate_release_count == 1 )); then
            prior_release_id=$(jq -r \
              --arg tag "$candidate_tag" \
              '.[][] | select(.tag_name == $tag) | .id' \
              "$candidate_releases")
            if [[ ! "$prior_release_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "Candidate release ${candidate_tag} has no valid release ID; it was preserved." >&2
              exit 1
            fi
            prior_release=$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${prior_release_id}")
            prior_release_id=$(jq -r '.id' <<<"$prior_release")
            prior_body=$(jq -c '.body' <<<"$prior_release")
            expected_body_prefix=$(cat release_body.md)
            if [[ ! "$prior_release_id" =~ ^[1-9][0-9]*$ || \
                  "$(jq -r '.tag_name' <<<"$prior_release")" != "$candidate_tag" || \
                  "$(jq -r '.target_commitish' <<<"$prior_release" | tr '[:upper:]' '[:lower:]')" != "${GITHUB_SHA,,}" || \
                  "$(jq -r '.name' <<<"$prior_release")" != "$release_name" || \
                  "$(jq -r '.draft' <<<"$prior_release")" != true || \
                  "$(jq -r '.prerelease' <<<"$prior_release")" != "$prerelease" || \
                  "$(jq -r '.immutable' <<<"$prior_release")" != false || \
                  "$(jq -r '.body' <<<"$prior_release")" != "$expected_body_prefix"* ]]; then
              echo "Existing candidate ${candidate_tag} does not exactly belong to this release; it was preserved." >&2
              exit 1
            fi

            "$RUNNER_TEMP/verify-release-assets.sh" \
              "$prior_release_id" artifacts "$RUNNER_TEMP/prior-candidate-release-assets" subset

            prior_ref_error="$RUNNER_TEMP/prior-candidate-ref-error"
            if prior_ref=$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${candidate_tag}" \
              2>"$prior_ref_error"); then
              if [[ "$(jq -r '.object.type' <<<"$prior_ref")" != commit || \
                    "$(jq -r '.object.sha' <<<"$prior_ref" | tr '[:upper:]' '[:lower:]')" != "${GITHUB_SHA,,}" ]]; then
                echo "Existing candidate ref ${candidate_tag} changed identity; interrupted state was preserved." >&2
                exit 1
              fi
              if ! gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${candidate_tag}"; then
                echo "Interrupted candidate ref deletion returned an error; checking its final state." >&2
              fi
              if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${candidate_tag}" \
                > /dev/null 2>"$RUNNER_TEMP/prior-candidate-ref-after-delete-error"; then
                echo "Interrupted candidate ref ${candidate_tag} remains; its release was preserved." >&2
                exit 1
              elif ! grep -Eq 'HTTP 404|Not Found' \
                "$RUNNER_TEMP/prior-candidate-ref-after-delete-error"; then
                cat "$RUNNER_TEMP/prior-candidate-ref-after-delete-error" >&2
                echo "Could not confirm removal of interrupted candidate ref ${candidate_tag}; its release was preserved." >&2
                exit 1
              fi
            elif ! grep -Eq 'HTTP 404|Not Found' "$prior_ref_error"; then
              cat "$prior_ref_error" >&2
              echo "Could not inspect interrupted candidate ref ${candidate_tag}; nothing was removed." >&2
              exit 1
            fi

            prior_release_again=$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${prior_release_id}")
            if [[ "$(jq -r '.id' <<<"$prior_release_again")" != "$prior_release_id" || \
                  "$(jq -r '.tag_name' <<<"$prior_release_again")" != "$candidate_tag" || \
                  "$(jq -r '.target_commitish' <<<"$prior_release_again" | tr '[:upper:]' '[:lower:]')" != "${GITHUB_SHA,,}" || \
                  "$(jq -r '.name' <<<"$prior_release_again")" != "$release_name" || \
                  "$(jq -r '.draft' <<<"$prior_release_again")" != true || \
                  "$(jq -r '.prerelease' <<<"$prior_release_again")" != "$prerelease" || \
                  "$(jq -r '.immutable' <<<"$prior_release_again")" != false || \
                  "$(jq -c '.body' <<<"$prior_release_again")" != "$prior_body" ]]; then
              echo "Interrupted candidate ${prior_release_id} changed before deletion; it was preserved." >&2
              exit 1
            fi
            "$RUNNER_TEMP/verify-release-assets.sh" \
              "$prior_release_id" artifacts "$RUNNER_TEMP/prior-candidate-assets-before-delete" subset
            if ! gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/${prior_release_id}"; then
              echo "Interrupted candidate release deletion returned an error; checking its final state." >&2
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/releases/${prior_release_id}" \
              > /dev/null 2>"$RUNNER_TEMP/prior-candidate-after-delete-error"; then
              echo "Interrupted candidate release ${prior_release_id} remains; refusing to overlap it." >&2
              exit 1
            elif ! grep -Eq 'HTTP 404|Not Found' \
              "$RUNNER_TEMP/prior-candidate-after-delete-error"; then
              cat "$RUNNER_TEMP/prior-candidate-after-delete-error" >&2
              echo "Could not confirm removal of interrupted candidate release ${prior_release_id}." >&2
              exit 1
            fi
            echo "Removed verified interrupted candidate release ${prior_release_id}."
          fi
          candidate_ref_error="$RUNNER_TEMP/candidate-ref-preflight-error"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${candidate_tag}" \
            > /dev/null 2>"$candidate_ref_error"; then
            echo "Candidate ref ${candidate_tag} exists without its verified draft; refusing to delete or reuse it." >&2
            exit 1
          elif ! grep -Eq 'HTTP 404|Not Found' "$candidate_ref_error"; then
            cat "$candidate_ref_error" >&2
            echo "Could not prove candidate ref ${candidate_tag} is absent." >&2
            exit 1
          fi
          jq -n \
            --arg tag "$candidate_tag" \
            --arg target "$GITHUB_SHA" \
            --arg name "$release_name" \
            --rawfile body release_body.md \
            --argjson prerelease "$prerelease" \
            '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:true,prerelease:$prerelease,generate_release_notes:true}' \
            > "$RUNNER_TEMP/candidate-release.json"
          release=$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases" \
            --input "$RUNNER_TEMP/candidate-release.json")
          release_id=$(jq -r '.id' <<<"$release")
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "GitHub did not return a valid candidate release ID." >&2
            exit 1
          fi
          jq -c '.body' <<<"$release" > "$RUNNER_TEMP/candidate-release-body.json"
          echo "id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "tag=${candidate_tag}" >> "$GITHUB_OUTPUT"
          expected_body_prefix=$(cat release_body.md)
          if [[ \
                "$(jq -r '.tag_name' <<<"$release")" != "$candidate_tag" || \
                "$(jq -r '.target_commitish' <<<"$release")" != "$GITHUB_SHA" || \
                "$(jq -r '.name' <<<"$release")" != "$release_name" || \
                "$(jq -r '.draft' <<<"$release")" != true || \
                "$(jq -r '.prerelease' <<<"$release")" != "$prerelease" || \
                "$(jq -r '.immutable' <<<"$release")" != false || \
                "$(jq -r '.body' <<<"$release")" != "$expected_body_prefix"* ]]; then
            echo "GitHub did not create the isolated candidate draft as requested." >&2
            exit 1
          fi
      - name: Upload and verify isolated candidate assets
        if: needs.meta.outputs.is_dev != 'true' && steps.candidate.outputs.id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_ID: ${{ steps.candidate.outputs.id }}
        run: |
          gh release upload "$CANDIDATE_TAG" artifacts/*
          "$RUNNER_TEMP/verify-release-assets.sh" \
            "$RELEASE_ID" artifacts "$RUNNER_TEMP/candidate-release-assets" exact
      - name: Confirm exact tag still targets this source before cutover
        if: needs.meta.outputs.is_dev != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "$RUNNER_TEMP/verify-release-tag.sh"
      - name: Publish verified candidate on the exact tag
        id: publish
        if: needs.meta.outputs.is_dev != 'true' && steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.candidate.outputs.id }}
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          release_name="$tag"
          prerelease="${{ needs.meta.outputs.prerelease }}"
          candidate_is_exact() {
            local candidate_json=$1
            [[ "$(jq -r '.tag_name' <<<"$candidate_json")" == "$CANDIDATE_TAG" && \
               "$(jq -r '.target_commitish' <<<"$candidate_json")" == "$GITHUB_SHA" && \
               "$(jq -r '.name' <<<"$candidate_json")" == "$release_name" && \
               "$(jq -r '.draft' <<<"$candidate_json")" == true && \
               "$(jq -r '.prerelease' <<<"$candidate_json")" == "$prerelease" && \
               "$(jq -r '.immutable' <<<"$candidate_json")" == false ]] && \
              cmp -s "$RUNNER_TEMP/candidate-release-body.json" \
                <(jq -c '.body' <<<"$candidate_json")
          }
          candidate=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")
          if ! candidate_is_exact "$candidate"; then
            echo "Candidate release changed after verification; refusing publication." >&2
            exit 1
          fi
          "$RUNNER_TEMP/verify-release-assets.sh" \
            "$RELEASE_ID" artifacts "$RUNNER_TEMP/pre-cutover-candidate-assets" exact
          candidate_before_publish=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")
          if ! candidate_is_exact "$candidate_before_publish"; then
            echo "Candidate release changed immediately before publication; refusing cutover." >&2
            exit 1
          fi
          "$RUNNER_TEMP/verify-release-tag.sh"
          jq -n --arg tag "$tag" --arg name "$release_name" \
            --argjson prerelease "$prerelease" \
            '{tag_name:$tag,name:$name,draft:false,prerelease:$prerelease}' \
            > "$RUNNER_TEMP/publish-release.json"
          published=$(gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --input "$RUNNER_TEMP/publish-release.json")
          if [[ "$(jq -r '.id' <<<"$published")" != "$RELEASE_ID" || \
                "$(jq -r '.tag_name' <<<"$published")" != "$tag" || \
                "$(jq -r '.target_commitish' <<<"$published")" != "$GITHUB_SHA" || \
                "$(jq -r '.name' <<<"$published")" != "$release_name" || \
                "$(jq -r '.draft' <<<"$published")" != false || \
                "$(jq -r '.prerelease' <<<"$published")" != "$prerelease" || \
                "$(jq -r '.immutable' <<<"$published")" != false ]] || \
             ! cmp -s "$RUNNER_TEMP/candidate-release-body.json" <(jq -c '.body' <<<"$published"); then
            echo "GitHub did not publish the expected release ${RELEASE_ID} for ${tag}." >&2
            exit 1
          fi
          "$RUNNER_TEMP/verify-release-tag.sh"
          "$RUNNER_TEMP/verify-release-assets.sh" \
            "$RELEASE_ID" artifacts "$RUNNER_TEMP/published-release-assets" exact
          echo "complete=true" >> "$GITHUB_OUTPUT"
      - name: Remove temporary cutover state after verified publication
        if: needs.meta.outputs.is_dev != 'true' && steps.publish.outputs.complete == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.candidate.outputs.id }}
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          final_tag="${GITHUB_REF#refs/tags/}"
          published=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")
          expected_prerelease="${{ needs.meta.outputs.prerelease }}"
          if [[ "$(jq -r '.id' <<<"$published")" != "$RELEASE_ID" || \
                "$(jq -r '.tag_name' <<<"$published")" != "$final_tag" || \
                "$(jq -r '.target_commitish' <<<"$published")" != "$GITHUB_SHA" || \
                "$(jq -r '.name' <<<"$published")" != "$final_tag" || \
                "$(jq -r '.draft' <<<"$published")" != false || \
                "$(jq -r '.prerelease' <<<"$published")" != "$expected_prerelease" || \
                "$(jq -r '.immutable' <<<"$published")" != false ]] || \
             ! cmp -s "$RUNNER_TEMP/candidate-release-body.json" <(jq -c '.body' <<<"$published"); then
            echo "Published release ${RELEASE_ID} changed before temporary-state cleanup; nothing was deleted." >&2
            exit 1
          fi
          "$RUNNER_TEMP/verify-release-tag.sh"
          "$RUNNER_TEMP/verify-release-assets.sh" \
            "$RELEASE_ID" artifacts "$RUNNER_TEMP/cleanup-verified-release-assets" exact

          cleanup_errors=()
          candidate_ref_error="$RUNNER_TEMP/candidate-ref-cleanup-error"
          if candidate_ref=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${CANDIDATE_TAG}" \
            2>"$candidate_ref_error"); then
            candidate_ref_sha=$(jq -r '.object.sha' <<<"$candidate_ref")
            if [[ "$(jq -r '.object.type' <<<"$candidate_ref")" != commit || \
                  "${candidate_ref_sha,,}" != "${GITHUB_SHA,,}" ]]; then
              cleanup_errors+=("candidate ref ${CANDIDATE_TAG} changed identity and was preserved")
            else
              if ! gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${CANDIDATE_TAG}"; then
                echo "Deletion of candidate ref ${CANDIDATE_TAG} returned an error; checking its final state." >&2
              fi
              candidate_after_error="$RUNNER_TEMP/candidate-ref-after-delete-error"
              if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${CANDIDATE_TAG}" \
                > /dev/null 2>"$candidate_after_error"; then
                cleanup_errors+=("candidate ref ${CANDIDATE_TAG} remains")
              elif ! grep -Eq 'HTTP 404|Not Found' "$candidate_after_error"; then
                cleanup_errors+=("candidate ref ${CANDIDATE_TAG} deletion could not be confirmed")
              fi
            fi
          elif ! grep -Eq 'HTTP 404|Not Found' "$candidate_ref_error"; then
            cleanup_errors+=("candidate ref ${CANDIDATE_TAG} could not be inspected")
          fi

          if (( ${#cleanup_errors[@]} > 0 )); then
            printf 'Verified release %s remains published, but temporary state cleanup failed:\n' \
              "$RELEASE_ID" >&2
            printf ' - %s\n' "${cleanup_errors[@]}" >&2
            exit 1
          fi
      - name: Remove only this run's incomplete candidate
        if: always() && needs.meta.outputs.is_dev != 'true' && steps.candidate.outputs.id != '' && steps.publish.outputs.complete != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.candidate.outputs.id }}
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          # Releases are deleted by stable positive ID and refs by their verified
          # full name after immediate revalidation. GitHub offers no conditional
          # delete token for either object, so this cleanup is safe among the
          # serialized workflow participants but assumes administrators do not
          # race a manual mutation between the observation and delete request.
          candidate_release_error="$RUNNER_TEMP/incomplete-candidate-release-error"
          if release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            2>"$candidate_release_error"); then
            release_missing=false
          elif grep -Eq 'HTTP 404|Not Found' "$candidate_release_error"; then
            release_missing=true
          else
            cat "$candidate_release_error" >&2
            echo "Could not inspect candidate release ${RELEASE_ID} (${CANDIDATE_TAG}); it was preserved." >&2
            exit 1
          fi
          final_tag="${GITHUB_REF#refs/tags/}"
          expected_prerelease="${{ needs.meta.outputs.prerelease }}"
          if [[ "$release_missing" == false ]]; then
            tag=$(jq -r '.tag_name' <<<"$release")
            target=$(jq -r '.target_commitish' <<<"$release")
            draft=$(jq -r '.draft' <<<"$release")
            if [[ "$(jq -r '.id' <<<"$release")" != "$RELEASE_ID" || \
                  "${target,,}" != "${GITHUB_SHA,,}" || \
                  "$(jq -r '.name' <<<"$release")" != "$final_tag" || \
                  "$(jq -r '.prerelease' <<<"$release")" != "$expected_prerelease" || \
                  "$(jq -r '.immutable' <<<"$release")" != false ]] || \
               ! cmp -s "$RUNNER_TEMP/candidate-release-body.json" <(jq -c '.body' <<<"$release"); then
              echo "Release ${RELEASE_ID} no longer matches this run; refusing cleanup." >&2
              exit 1
            fi

            if [[ "$tag" == "$final_tag" && "$draft" == false ]]; then
              "$RUNNER_TEMP/verify-release-tag.sh"
              "$RUNNER_TEMP/verify-release-assets.sh" \
                "$RELEASE_ID" artifacts "$RUNNER_TEMP/recovered-published-release-assets" exact
              echo "Release ${RELEASE_ID} is already published on ${final_tag}; it was verified and preserved for rerun recovery."
              exit 0
            fi
            if [[ "$tag" != "$CANDIDATE_TAG" || "$draft" != true ]]; then
              echo "Release ${RELEASE_ID} is neither this run's candidate draft nor its exact published release; it was preserved." >&2
              exit 1
            fi
            "$RUNNER_TEMP/verify-release-assets.sh" \
              "$RELEASE_ID" artifacts "$RUNNER_TEMP/incomplete-candidate-assets" subset
          fi

          candidate_ref_error="$RUNNER_TEMP/incomplete-candidate-ref-error"
          if candidate_ref=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${CANDIDATE_TAG}" \
            2>"$candidate_ref_error"); then
            if [[ "$(jq -r '.object.type' <<<"$candidate_ref")" != commit || \
                  "$(jq -r '.object.sha' <<<"$candidate_ref" | tr '[:upper:]' '[:lower:]')" != "${GITHUB_SHA,,}" ]]; then
              echo "Candidate ref ${CANDIDATE_TAG} for release ${RELEASE_ID} no longer belongs to this run; it was preserved." >&2
              exit 1
            fi
            if ! gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${CANDIDATE_TAG}"; then
              echo "Candidate ref ${CANDIDATE_TAG} deletion returned an error; checking its final state." >&2
            fi
            candidate_ref_after_error="$RUNNER_TEMP/incomplete-candidate-ref-after-delete-error"
            if candidate_ref_after=$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${CANDIDATE_TAG}" \
              2>"$candidate_ref_after_error"); then
              if [[ "$(jq -r '.object.type' <<<"$candidate_ref_after")" != commit || \
                    "$(jq -r '.object.sha' <<<"$candidate_ref_after" | tr '[:upper:]' '[:lower:]')" != "${GITHUB_SHA,,}" ]]; then
                echo "Candidate ref ${CANDIDATE_TAG} changed identity after deletion was requested; it was preserved." >&2
              else
                echo "Candidate ref ${CANDIDATE_TAG} for release ${RELEASE_ID} remains; rerun cleanup after checking GitHub." >&2
              fi
              exit 1
            elif ! grep -Eq 'HTTP 404|Not Found' "$candidate_ref_after_error"; then
              cat "$candidate_ref_after_error" >&2
              echo "Candidate ref ${CANDIDATE_TAG} deletion state is ambiguous for release ${RELEASE_ID}; rerun cleanup after checking GitHub." >&2
              exit 1
            fi
          elif ! grep -Eq 'HTTP 404|Not Found' "$candidate_ref_error"; then
            cat "$candidate_ref_error" >&2
            echo "Could not inspect candidate ref ${CANDIDATE_TAG} for release ${RELEASE_ID}; nothing else was changed." >&2
            exit 1
          fi

          if [[ "$release_missing" == true ]]; then
            exit 0
          fi

          release_before_delete=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")
          if [[ "$(jq -r '.id' <<<"$release_before_delete")" != "$RELEASE_ID" || \
                "$(jq -r '.tag_name' <<<"$release_before_delete")" != "$CANDIDATE_TAG" || \
                "$(jq -r '.target_commitish' <<<"$release_before_delete" | tr '[:upper:]' '[:lower:]')" != "${GITHUB_SHA,,}" || \
                "$(jq -r '.name' <<<"$release_before_delete")" != "$final_tag" || \
                "$(jq -r '.draft' <<<"$release_before_delete")" != true || \
                "$(jq -r '.prerelease' <<<"$release_before_delete")" != "$expected_prerelease" || \
                "$(jq -r '.immutable' <<<"$release_before_delete")" != false ]] || \
             ! cmp -s "$RUNNER_TEMP/candidate-release-body.json" <(jq -c '.body' <<<"$release_before_delete"); then
            echo "Candidate release ${RELEASE_ID} changed before deletion; it was preserved." >&2
            exit 1
          fi
          "$RUNNER_TEMP/verify-release-assets.sh" \
            "$RELEASE_ID" artifacts "$RUNNER_TEMP/pre-delete-candidate-assets" subset
          if ! gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"; then
            echo "Candidate release ${RELEASE_ID} (${CANDIDATE_TAG}) deletion returned an error; checking its final state." >&2
          fi
          candidate_release_after_error="$RUNNER_TEMP/incomplete-candidate-release-after-delete-error"
          if release_after=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            2>"$candidate_release_after_error"); then
            echo "Candidate release ${RELEASE_ID} remains after deletion was requested; it was not deleted again." >&2
            exit 1
          elif ! grep -Eq 'HTTP 404|Not Found' "$candidate_release_after_error"; then
            cat "$candidate_release_after_error" >&2
            echo "Candidate release ${RELEASE_ID} (${CANDIDATE_TAG}) deletion state is ambiguous; rerun cleanup after checking GitHub." >&2
            exit 1
          fi
          echo "Removed this run's incomplete candidate release ${RELEASE_ID}."
      - name: Recover or release exact shared remote publication lock
        if: always() && needs.meta.outputs.is_dev != 'true' && steps.publication_lock.outputs.cleanup_candidate == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCK_TAG: ${{ steps.publication_lock.outputs.tag }}
          LOCK_TAG_OBJECT_SHA: ${{ steps.publication_lock.outputs.tag_object_sha }}
          LOCK_SOURCE_SHA: ${{ steps.publication_lock.outputs.source_sha }}
          LOCK_TRANSACTION: ${{ steps.publication_lock.outputs.transaction }}
          LOCK_MESSAGE: ${{ steps.publication_lock.outputs.message }}
        run: |
          set -euo pipefail
          expected_ref="refs/tags/${LOCK_TAG}"
          if [[ "$LOCK_TAG" != codex-switch-publish-dev-lock || \
                ! "$LOCK_TAG_OBJECT_SHA" =~ ^[0-9a-f]{40}$ || \
                ! "$LOCK_SOURCE_SHA" =~ ^[0-9a-f]{40}$ || \
                ! "$LOCK_TRANSACTION" =~ ^[0-9a-f]{32}$ ]]; then
            echo "Persisted shared publication lock candidate identity is invalid; nothing was removed." >&2
            exit 1
          fi
          expected_message="codex-switch-global-pace publish-dev lock v1|repo=${GITHUB_REPOSITORY}|source=${LOCK_SOURCE_SHA}|transaction=${LOCK_TRANSACTION}"
          if [[ "$LOCK_MESSAGE" != "$expected_message" ]]; then
            echo "Persisted shared publication lock message is invalid; nothing was removed." >&2
            exit 1
          fi

          current_ref_error="$RUNNER_TEMP/shared-publication-lock-release-ref-error"
          if ! current_ref=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${LOCK_TAG}" \
            2>"$current_ref_error"); then
            if grep -Eq 'HTTP 404|Not Found' "$current_ref_error"; then
              echo "Shared publication lock ${expected_ref} was never created or is already absent."
              exit 0
            fi
            cat "$current_ref_error" >&2
            echo "Candidate shared publication lock could not be read before cleanup; nothing was removed." >&2
            exit 1
          fi
          if ! jq -e 'type == "object"' <<<"$current_ref" > /dev/null; then
            echo "Candidate shared publication lock ref returned invalid JSON; nothing was removed." >&2
            exit 1
          fi
          if [[ "$(jq -r '.ref' <<<"$current_ref")" != "$expected_ref" || \
                "$(jq -r '.object.type' <<<"$current_ref")" != tag || \
                "$(jq -r '.object.sha' <<<"$current_ref" | tr '[:upper:]' '[:lower:]')" != "$LOCK_TAG_OBJECT_SHA" ]]; then
            echo "Shared publication lock ref changed identity; it was preserved." >&2
            exit 1
          fi

          current_tag_error="$RUNNER_TEMP/shared-publication-lock-release-tag-error"
          if ! current_tag=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/tags/${LOCK_TAG_OBJECT_SHA}" \
            2>"$current_tag_error"); then
            cat "$current_tag_error" >&2
            echo "Candidate shared publication lock object could not be read before cleanup; nothing was removed." >&2
            exit 1
          fi
          if ! jq -e 'type == "object"' <<<"$current_tag" > /dev/null; then
            echo "Candidate shared publication lock object returned invalid JSON; nothing was removed." >&2
            exit 1
          fi
          if [[ "$(jq -r '.sha' <<<"$current_tag" | tr '[:upper:]' '[:lower:]')" != "$LOCK_TAG_OBJECT_SHA" || \
                "$(jq -r '.tag' <<<"$current_tag")" != "$LOCK_TAG" || \
                "$(jq -r '.message' <<<"$current_tag")" != "$LOCK_MESSAGE" || \
                "$(jq -r '.object.type' <<<"$current_tag")" != commit || \
                "$(jq -r '.object.sha' <<<"$current_tag" | tr '[:upper:]' '[:lower:]')" != "$LOCK_SOURCE_SHA" ]]; then
            echo "Shared publication lock object changed identity; it was preserved." >&2
            exit 1
          fi

          lease="--force-with-lease=${expected_ref}:${LOCK_TAG_OBJECT_SHA}"
          if git -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' \
            push --porcelain --no-verify "$lease" \
            "https://github.com/${GITHUB_REPOSITORY}.git" ":${expected_ref}"; then
            delete_status=0
          else
            delete_status=$?
            echo "Leased shared publication lock deletion returned status ${delete_status}; checking the exact final ref state." >&2
          fi

          after_error="$RUNNER_TEMP/shared-publication-lock-after-delete-error"
          if after_ref=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${LOCK_TAG}" \
            2>"$after_error"); then
            if ! jq -e 'type == "object"' <<<"$after_ref" > /dev/null; then
              echo "Shared publication lock post-delete check returned invalid JSON; deletion was not retried." >&2
              exit 1
            fi
            if [[ "$(jq -r '.ref' <<<"$after_ref")" == "$expected_ref" && \
                  "$(jq -r '.object.type' <<<"$after_ref")" == tag && \
                  "$(jq -r '.object.sha' <<<"$after_ref" | tr '[:upper:]' '[:lower:]')" == "$LOCK_TAG_OBJECT_SHA" ]]; then
              echo "The exact shared publication lock remains after leased deletion; it was not deleted again." >&2
            else
              echo "The shared publication lock changed identity during leased deletion; the new ref was preserved." >&2
            fi
            exit 1
          elif ! grep -Eq 'HTTP 404|Not Found' "$after_error"; then
            cat "$after_error" >&2
            echo "Shared publication lock deletion state is ambiguous; deletion was not retried." >&2
            exit 1
          fi
          echo "Released exact shared publication lock ${expected_ref}."
