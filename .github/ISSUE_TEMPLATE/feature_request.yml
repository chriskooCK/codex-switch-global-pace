name: Feature request
description: Propose a user-visible improvement without sharing private account data.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Security reports belong in [private vulnerability reporting](https://github.com/chriskooCK/codex-switch-global-pace/security/advisories/new). Do not include tokens, auth/profile/recovery files, account identities, private paths, proxy credentials, or raw logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the workflow using synthetic account names and redacted paths.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, identities, private paths, and other sensitive data.
          required: true
