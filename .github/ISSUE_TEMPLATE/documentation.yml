name: Documentation problem
description: Report missing, incorrect, or confusing documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Describe the public documentation only. Do not paste credentials, `auth.json`, profile or recovery files, private paths, account identifiers, or unredacted logs. Report security-sensitive documentation gaps through [private vulnerability reporting](https://github.com/chriskooCK/codex-switch-global-pace/security/advisories/new).
  - type: input
    id: page
    attributes:
      label: Page or section
      description: Link the page and name the heading, when possible.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: proposed-change
    attributes:
      label: Suggested wording or outcome
      description: Use placeholders in examples; never include a real alias, path, token, email, or account ID.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, identities, private paths, and other sensitive data.
          required: true
