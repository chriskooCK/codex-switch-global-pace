[package]
name = "codex-switch-global-pace"
version = "20260826.6.0"
edition = "2024"
rust-version = "1.88"
description = "Codex multi-profile manager with a global weekly pace dashboard"
license = "MIT"
repository = "https://github.com/chriskooCK/codex-switch-global-pace"
keywords = ["codex", "openai", "account", "switcher", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "codex_switch"
path = "src/lib.rs"

[[bin]]
name = "codex-switch-global-pace"
path = "src/main.rs"

[[test]]
name = "test_mock_http"
path = "tests/test_mock_http.rs"
required-features = ["test-endpoints"]

[[test]]
name = "test_refresh_persistence"
path = "tests/test_refresh_persistence.rs"
required-features = ["test-endpoints"]

[[test]]
name = "test_daemon_integration"
path = "tests/test_daemon_integration.rs"
required-features = ["test-endpoints"]

[features]
# Enables mock HTTP endpoint overrides for integration-test binaries. The
# implementation rejects this feature in optimized release builds.
test-endpoints = []

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
semver = "1"
reqwest = { version = "0.12", features = [
    "json",
    # Both root stores, not one: the OS trust store is what makes an
    # intercepting proxy's CA work the way it already does for curl and the
    # browser, while the bundled Mozilla list keeps a slim container that ships
    # no ca-certificates from losing HTTPS entirely.
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
    "socks",
    # Off by default here because default-features is disabled; without it a
    # macOS user whose proxy lives in System Settings (rather than in the
    # environment or --proxy) gets connection failures the browser does not.
    "macos-system-configuration",
], default-features = false }
tempfile = "3"
webbrowser = "1.2.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
ratatui = "0.30"
crossterm = "0.29"
urlencoding = "2"
toml = "1"
rand = "0.10"
fs4 = "1.1.0"
chrono = { version = "0.4", features = ["clock"] }
supports-color = "3"
owo-colors = "4"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
